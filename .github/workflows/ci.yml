name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Python regression tests
        run: python3 -m unittest discover -s tests
      - name: Interface event replay
        run: |
          node tests/test_interface_flow.js
          node tests/test_guard_alerts.js
          node tests/test_setup_selection.js
          node tests/test_ip_risk_ui.js
          node tests/test_domain_ui.js
          node tests/test_hover_tips.js
      - name: Build without installing
        run: python3 build.py
